# Normal Form — UCI 2.5 message catalog (MVP subset: the Command-2 pattern).
#
# Fidelity rule (docs/02-fidelity.md): the game may OMIT, never RENAME or INVENT.
# Every `name:` below and every enum `values:` literal is grep-able as a
# name="…" / value="…" identifier in the UCI XSD; every CERT/RQMT number inside a
# `cite:` is grep-able in the UCI .txt specifications. tools/check-fidelity.ts
# enforces both from the first commit — the catalog is born policed.
#
# Verified against docs/UCI References/ (byte-identical vendored copy of the
# git-ignored docs/References/ sources):
#   UCI_MessageDefinitions_v2_5_0.xsd                          — schema names
#   02_OAC-STD-001_RevI_UCI_StandardDocument_v2_5.txt          — RQMT USTD-xxxxxx
#   04_OAC-SPC-001_RevE_UCI_SchemaStyleAndDesignSpecification…  — CERT SCH-xxxxxx
#   06_OAC-SPC-002_RevA_UCI_NormalizedInterfaceSpecification…   — CERT UNIS-xxxxxx

version: 1
xsd: UCI_MessageDefinitions_v2_5_0.xsd
# Keyed so a validator Finding can cite the exact file its verbatim quote lives in.
sources:
  std: 02_OAC-STD-001_RevI_UCI_StandardDocument_v2_5.txt
  spc: 04_OAC-SPC-001_RevE_UCI_SchemaStyleAndDesignSpecification_v2_5.txt
  unis: 06_OAC-SPC-002_RevA_UCI_NormalizedInterfaceSpecification_v2_5.txt

# --- Enumerations ----------------------------------------------------------
enums:
  - name: CommandStateEnum
    cite: "SPC-001 §5.1.1 (CommandBaseType); XSD CommandStateEnum"
    values: [NEW, UPDATE, CANCEL]

  - name: CommandProcessingStateEnum
    cite: "SPC-001 §5.1.1 Fig 5.1-3, Table 5.1-2; RECEIVED may not be reported; ACCEPTED/REJECTED/CANCELED terminal"
    values: [RECEIVED, ACCEPTED, REJECTED, CANCELED]

  - name: MessageModeEnum
    cite: "XSD MessageModeEnum"
    values: [LIVE, EXERCISE, SIMULATION, NONEXERCISE_SIMULATION]

# --- Envelope (wraps every placed message) ---------------------------------
# uci:MessageType = SecurityInformation + MessageHeader (uci:HeaderType).
envelope:
  - name: MessageType
    cite: "XSD MessageType — abstract envelope"
    fields:
      - { name: SecurityInformation, required: true, cite: "read-only marking chip; type in UCI_SecurityMarkings (not vendored)" }
      - { name: MessageHeader, ref: HeaderType, required: true }

  - name: HeaderType
    cite: "XSD HeaderType"
    fields:
      - { name: SystemID, required: true, cite: "player-filled (beat 1); missing SystemID => ENV HeaderType finding" }
      - { name: Timestamp, required: true, cite: "XSD HeaderType (DateTimeType)" }
      - { name: SchemaVersion, required: true, cite: "XSD HeaderType (UCI_SchemaVersionStringType)" }
      - { name: Mode, enum: MessageModeEnum, required: false }
      - { name: ServiceID, required: false, cite: "optional; omitted from the 4-field inspector" }
      - { name: MissionID, required: false, cite: "optional; omitted from the 4-field inspector" }

# --- Command-2 pattern: request + response ---------------------------------
# Commander (you) -> Commandee (SystemB). UNIS §4.6 CERT UNIS-000105;
# structure SPC-001 §5.1.1 CERT SCH-002461 (*Command / *CommandStatus suffixes).
messages:
  - name: TaskCommand
    mt: TaskCommandMT
    role: request
    cite: "UNIS §4.6 CERT UNIS-000105; SPC-001 §5.1.1 CERT SCH-002461; XSD TaskCommand / TaskCommandMT"
    fields:
      - { name: CommandID, ref: ID_Type, required: true, cite: "ID_Type.UUID; RQMT USTD-000436 (Leach-Salz/nil), RQMT USTD-000673 (canonical string)" }
      - { name: CommandState, enum: CommandStateEnum, required: true }

  - name: TaskCommandStatus
    mt: TaskCommandStatusMT
    role: response
    cite: "UNIS §4.6 CERT UNIS-000105; SPC-001 §5.1.1 CERT SCH-002461; XSD TaskCommandStatus / TaskCommandStatusMT"
    fields:
      - { name: CommandID, ref: ID_Type, required: true, cite: "correlation key back to the TaskCommand" }
      - { name: CommandProcessingState, enum: CommandProcessingStateEnum, required: true }

  # One-way (-1) publications (WS-E). No response message, terminal-on-send; the
  # producer fans them out to one or more consumers. Concrete real global elements.
  - name: SubsystemStatus
    mt: SubsystemStatusMT
    role: publication
    cite: "UNIS §4.1 CERT UNIS-000076; structure SPC-001 §5.1.6; XSD SubsystemStatus / SubsystemStatusMT"
    fields: []

  - name: Entity
    mt: EntityMT
    role: publication
    cite: "UNIS §4.2 CERT UNIS-000081; structure SPC-001 §5.1.5; XSD Entity / EntityMT"
    fields: []

# --- Shared base types referenced above ------------------------------------
types:
  - name: ID_Type
    cite: "XSD ID_Type = UUID + optional DescriptiveLabel"
    fields:
      - { name: UUID, required: true }
      - { name: DescriptiveLabel, required: false }

# --- Validator findings (compose gate, battery V1–V10) ---------------------
# The verbatim `quote` of each finding is grep-verified against the file named by
# `source` (whitespace-normalized) by tools/check-fidelity.ts — the "quotes the
# standard verbatim" guarantee. `code` carries the honest prefix (docs/02 lie #11):
# ENV = XSD validity, CERT/RQMT = interaction/style/compliance requirements, and
# game-rule findings (READY gate, mode-match) carry no standard quote.
findings:
  - id: V1-systemid
    code: "ENV HeaderType"
    message: "MessageHeader missing required SystemID"
    source: xsd
    docRef: "XSD HeaderType"
    quote: "This element represents the SystemID of the System that sent this message."

  - id: V2-timestamp
    code: "ENV HeaderType"
    message: "Timestamp missing or not ISO-8601"
    source: xsd
    docRef: "XSD HeaderType (DateTimeType)"
    quote: "This element represents the time and date at which the message was created and ready to be sent."

  - id: V3-schemaversion
    code: "ENV HeaderType"
    message: "SchemaVersion missing or malformed"
    source: xsd
    docRef: "XSD HeaderType / UCI_SchemaVersionStringType"
    quote: "Indicates the schema version used to generate the message."

  - id: V4-mode-enum
    code: "ENV HeaderType"
    message: "Mode is not a valid MessageModeEnum value"
    source: xsd
    docRef: "XSD HeaderType / MessageModeEnum"
    quote: "See enumeration values for details."

  - id: V4-mode-mismatch
    code: "ENV HeaderType"
    message: "Mode does not match the sheet's declared mode"
    source: game-rule
    docRef: "game rule (mode-match, docs/02 lie #3)"

  - id: V5-uuid-invalid
    code: "RQMT USTD-000436"
    message: "CommandID is not a valid RFC-4122 UUID"
    source: std
    docRef: "STD-001 §3"
    quote: "UCI UUIDs shall conform to any version of the Leach-Salz UUID variant (variant 1) or the nil UUID described in RFC 4122."

  - id: V6-uuid-noncanonical
    code: "RQMT USTD-000673"
    message: "CommandID is not in canonical UUID string form"
    source: std
    docRef: "STD-001 §3"
    quote: "UCI UUIDs shall conform to the UUID string representation"

  - id: V7-commandstate
    code: "ENV CommandBaseType"
    message: "CommandState is not a valid CommandStateEnum value"
    source: xsd
    docRef: "XSD CommandBaseType"
    quote: "The state of the command message data."

  - id: V8-binding
    code: "CERT SCH-002461"
    message: "request/response must be named <MsgName>Command / <MsgName>CommandStatus"
    source: spc
    docRef: "SPC-001 §5.1.1"
    quote: "All Command-2 primitive types shall consist of two messages with names of the form"

  - id: V9-roles
    code: "CERT UNIS-000105"
    message: "both Command-2 roles must be bound to lifelines"
    source: unis
    docRef: "UNIS §4.6"
    quote: "A UCI Component fulfilling a role identified in the Command-2 message interaction pattern shall follow the interaction pattern"

  - id: V10-terminal-handler
    code: "READY"
    message: "no handler wired for a reachable terminal state"
    source: game-rule
    docRef: "game rule (READY gate)"

  # Runtime-failure lessons (RUN phase, not the compose validator). Quoted
  # verbatim and policed like the V-findings; the game surfaces these on a seed
  # failure (docs/02-fidelity.md §5, PLAN_MVP S6). `code` cites a section, not a
  # CERT number, so the CERT-number check does not fire; the quote check does.
  - id: RUN-ordering
    code: "UNIS §4"
    message: "the bus assumes no ordering — gating ACCEPTED behind RECEIVED can hang"
    source: unis
    docRef: "UNIS §4 (Interaction Patterns)"
    quote: "there can be no assumption that messages come in any order or that there is guaranteed delivery"

  - id: RUN-terminal
    code: "UNIS §4.6.2"
    message: "acting on a response after a terminal state — the sequence had already ended"
    source: unis
    docRef: "UNIS §4.6.2 (Command-2 Terminal State Behavior)"
    quote: "once a terminal state is reported, the sequence should end"

  # One-way (-1) run-failure lessons (WS-E). A -1 datum owes no delivery, so the
  # only recourse is republication — both lessons quote the no-guaranteed-delivery
  # rule that makes that true.
  - id: RUN-stale
    code: "UNIS §4.2"
    message: "a consumer went stale — a -1 datum owes no delivery; republish to keep it fresh"
    source: unis
    docRef: "UNIS §4 (no guaranteed delivery)"
    quote: "there can be no assumption that messages come in any order or that there is guaranteed delivery"

  - id: RUN-deadline
    code: "UNIS §4.1"
    message: "your status was not shown by the deadline — publish earlier, and again"
    source: unis
    docRef: "UNIS §4 (no guaranteed delivery)"
    quote: "there can be no assumption that messages come in any order or that there is guaranteed delivery"

# --- UCI Reference codex (WS-D; docs/07-uci-reference.md) -------------------
# The curated prose layer of the in-game UCI REFERENCE screen, authored here so
# it runs through the SAME fidelity gate as everything else: every CERT/RQMT
# number inside a `cite:`, every string in a `names:` list, and every `text:`
# with a `source:` is grep-checked by tools/check-fidelity.ts. An invented number,
# an invented XSD name, or a misquote in this section fails the build.
#
# Not policed (deliberately): free prose (blurb, summary, roles, naming, owns),
# pattern `name`/`naming` values (`Command-2`, `*Command` are not XSD identifiers),
# and the A-GRA bridge rows (they name sibling-game messages absent from the UCI
# XSD; docs/02-fidelity §4 frames the bridge as shape-level, not a UCI citation).
reference:
  overview:
    blurb:
      - "UCI — the Universal Command and Control (C2) Interface — is a messaging standard: a common grammar that lets independently built systems command, query, and inform each other without sharing code, hardware, or even a transport."
      - "Everything the game puts on the board is real: the message names, the fields, the state enums, and every rule that fails you is quoted verbatim from the standard. The game may omit; it never renames or invents."
    quote:
      text: "Universal Command and Control (C2) Interface (UCI) is a messaging standard"
      source: std
      cite: "STD-001 §1"
    documents:
      - { key: std, title: "STD-001", owns: "compliance requirements (RQMT USTD-…) — who must conform to what" }
      - { key: unis, title: "UNIS / SPC-002", owns: "the interaction patterns and their CERT UNIS-… numbers — behavior on the wire" }
      - { key: spc, title: "SPC-001", owns: "schema style and structure, the CERT SCH-… numbers — how a message is shaped" }
  patterns:
    - name: Status-1
      roles: "Producer → Consumer(s)"
      naming: "*Status (or a name matching no other primitive)"
      unlocksAt: "0-1"
      summary: "Fire-and-forget publication to one or more consumers; terminal on send, no acknowledgement. Announces state nobody has to accept."
      cite: "UNIS §4.1 CERT UNIS-000076; structure SPC-001 §5.1.6"
    - name: Data-1
      roles: "Producer → Consumer(s)"
      naming: "bare name (a datum, e.g. an Entity or a Plan)"
      unlocksAt: "0-2"
      summary: "Fire-and-forget publication of a datum other components reference; asynchronous and/or periodic. Like Status-1, no delivery is owed."
      cite: "UNIS §4.2 CERT UNIS-000081; structure SPC-001 §5.1.5"
    - name: DataRecord-1
      roles: "Producer → Consumer(s)"
      naming: "bare name; optional DataRecordInstanceID keys the record"
      unlocksAt: "post-1.0 (World 2)"
      summary: "Data-1 for managed records. With no instance ID it acts in the same manner as the Data-1 pattern; with one, the record has a lifecycle."
      cite: "UNIS §4.3 CERT UNIS-000087; structure SPC-001 §5.1.4 CERT SCH-002490"
      names: [DataRecordInstanceID]
    - name: DataRequest-2
      roles: "Requester → Requestee"
      naming: "*DataRequest / *DataRequestStatus"
      unlocksAt: "1-4"
      summary: "Ask for current data; the response is implicitly accepted by returning the requested status information. A request, not a command."
      cite: "UNIS §4.4 CERT UNIS-000093; structure SPC-001 §5.1.3 CERT SCH-002462"
    - name: ActionRequest-2
      roles: "Requester → Requestee"
      naming: "*Request / *RequestStatus"
      unlocksAt: "1-4"
      summary: "Ask a component to run a process that may be queued and worked over time; tracked through RequestProcessingStateEnum to a terminal state."
      cite: "UNIS §4.5 CERT UNIS-000099; structure SPC-001 §5.1.2 CERT SCH-002463"
    - name: Command-2
      roles: "Commander → Commandee"
      naming: "*Command / *CommandStatus"
      unlocksAt: "1-1"
      summary: "Demand an activity of a commandee and hold proof it happened; tracked through CommandProcessingStateEnum with a terminal state that ends the sequence."
      cite: "UNIS §4.6 CERT UNIS-000105; structure SPC-001 §5.1.1 CERT SCH-002461"
      names: [TaskCommand, TaskCommandStatus]
  quotes:
    - id: bus-no-ordering
      source: unis
      cite: "UNIS §4"
      text: "there can be no assumption that messages come in any order or that there is guaranteed delivery"
    - id: terminal-end
      source: unis
      cite: "UNIS §4.6.2"
      text: "once a terminal state is reported, the sequence should end"
    - id: received-optional
      source: spc
      cite: "SPC-001 §5.1.1"
      text: "that state may not be reported if the Commandee immediately transitions to one of the terminal states"
    - id: terminal-ignore-cancel
      source: xsd
      cite: "XSD CommandProcessingStateEnum (ACCEPTED / REJECTED annotations)"
      text: "This is a terminal state and the Subsystem or Service will ignore all subsequent updates to the Command, including CANCEL."
  bridge:
    - { primitive: "Command-2", brainSwap: "MA_FlightCommandMT / MA_FlightCommandStatusMT", serviceBus: "MA_TaskCommandMT / MA_TaskStatusMT round trip" }
    - { primitive: "ActionRequest-2", brainSwap: "MA_ControlRequestMT / MA_ControlRequestStatusMT (the handshake)", serviceBus: "MA_ApprovalRequestMT / MA_ApprovalRequestStatusMT (the QB approval gate)" }
    - { primitive: "DataRequest-2", brainSwap: "SubsystemStatusDataRequestMT (on-demand status)", serviceBus: "same demand class inside status interactions" }
    - { primitive: "Status-1", brainSwap: "ControlStatusMT; SubsystemStatusMT / ServiceStatusMT heartbeats; TaskStatusMT", serviceBus: "heartbeats and link-health reports (MA_CommTeamReportMT)" }
    - { primitive: "Data-1", brainSwap: "MA_FlightCapabilityMT; MA_TaskMT; EntityMT tracks; MA_RoutePlanMT", serviceBus: "COP distribution / sensor-track fan-out" }
    - { primitive: "DataRecord-1", brainSwap: "MA_FaultMT; FileMetadataMT", serviceBus: "Mission Data Package artifacts (MP class pre-load)" }
